<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>泰拉身高体检</title>
  <link rel="preload" href="bg.webp" as="image" type="image/webp" fetchpriority="high">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior-x: none;
      background: #000;
    }

    .track {
      display: flex;
      height: 100vh;
      height: 100dvh;
      touch-action: pan-y;
      cursor: grab;
      will-change: transform;
    }

    .track.is-dragging {
      cursor: grabbing;
    }

    .track img {
      display: block;
      flex: 0 0 auto;
      width: auto;
      height: 100%;
      user-select: none;
    }

  </style>
</head>
<body>
  <div class="track" id="track" aria-hidden="true">
    <img id="img1" src="bg.webp" width="14975" height="960" alt="" fetchpriority="high" draggable="false">
    <img id="img2" src="bg.webp" width="14975" height="960" alt="" draggable="false">
  </div>
  <script>
    const track = document.getElementById('track');
    const img1 = document.getElementById('img1');
    const img2 = document.getElementById('img2');

    // 可调参数
    const SLOWEST_DURATION = 600;
    const FASTEST_DURATION = 10;
    const DEFAULT_SPEED = 30;
    const DRAG_RESUME_DELAY = 1200;

    let renderWidth = 0;
    let currentSpeed = DEFAULT_SPEED;
    let offset = 0;
    let speedFactor = 0;
    let lastTimestamp = null;
    let animationId = null;
    let resizeId = null;
    let isDragging = false;
    let dragPointerId = null;
    let dragStartX = 0;
    let dragStartOffset = 0;
    let resumeAt = 0;

    function calcSpeedFactor(speedValue) {
      const duration = SLOWEST_DURATION
        - (speedValue - 1) * (SLOWEST_DURATION - FASTEST_DURATION) / 99;
      return renderWidth / duration;
    }

    function normalizeOffset(value) {
      if (!renderWidth) {
        return 0;
      }

      const normalized = value % renderWidth;
      return normalized > 0 ? normalized - renderWidth : normalized;
    }

    function render() {
      track.style.transform = `translate3d(${offset}px, 0, 0)`;
    }

    function animate(timestamp) {
      if (lastTimestamp === null) {
        lastTimestamp = timestamp;
      }

      const deltaSeconds = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (!isDragging && timestamp >= resumeAt) {
        offset = normalizeOffset(offset - speedFactor * deltaSeconds);
      }

      render();
      animationId = requestAnimationFrame(animate);
    }

    function setup() {
      img1.style.width = '';
      img2.style.width = '';
      renderWidth = img1.getBoundingClientRect().width;

      if (!renderWidth) {
        return;
      }

      track.style.width = `${renderWidth * 2}px`;
      img1.style.width = `${renderWidth}px`;
      img2.style.width = `${renderWidth}px`;
      offset = normalizeOffset(offset);
      speedFactor = calcSpeedFactor(currentSpeed);
      lastTimestamp = null;

      if (animationId !== null) {
        cancelAnimationFrame(animationId);
      }
      animationId = requestAnimationFrame(animate);
    }

    function startDrag(event) {
      if (!event.isPrimary
        || (event.pointerType === 'mouse' && event.button !== 0)
        || !renderWidth) {
        return;
      }

      event.preventDefault();
      isDragging = true;
      dragPointerId = event.pointerId;
      dragStartX = event.clientX;
      dragStartOffset = offset;
      track.classList.add('is-dragging');
      track.setPointerCapture(event.pointerId);
    }

    function moveDrag(event) {
      if (!isDragging || event.pointerId !== dragPointerId) {
        return;
      }

      event.preventDefault();
      offset = normalizeOffset(dragStartOffset + event.clientX - dragStartX);
      render();
    }

    function finishDrag(event) {
      if (!isDragging || event.pointerId !== dragPointerId) {
        return;
      }

      isDragging = false;
      dragPointerId = null;
      resumeAt = performance.now() + DRAG_RESUME_DELAY;
      lastTimestamp = null;
      track.classList.remove('is-dragging');

      if (track.hasPointerCapture(event.pointerId)) {
        track.releasePointerCapture(event.pointerId);
      }
    }

    track.addEventListener('pointerdown', startDrag);
    track.addEventListener('pointermove', moveDrag);
    track.addEventListener('pointerup', finishDrag);
    track.addEventListener('pointercancel', finishDrag);
    track.addEventListener('lostpointercapture', finishDrag);

    window.addEventListener('resize', () => {
      if (resizeId !== null) {
        cancelAnimationFrame(resizeId);
      }
      resizeId = requestAnimationFrame(setup);
    }, { passive: true });

    if (document.readyState === 'complete') {
      setup();
    } else {
      window.addEventListener('load', setup, { once: true });
    }
  </script>
</body>
</html>
