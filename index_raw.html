<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  body {
    overflow: hidden;
    overscroll-behavior-x: none;
    background: #000;
  }

  .track {
    display: flex;
    height: 100vh;
    touch-action: pan-y;
    cursor: grab;
    will-change: transform;
  }

  .track.is-dragging { cursor: grabbing; }

  .track img {
    height: 100vh;
    object-fit: contain;
    flex-shrink: 0;
    display: block;
  }

  /* ===== 暗角叠加层（始终保留 box-shadow，只过渡 opacity） ===== */
  #vignette {
    position: fixed;
    inset: 0;
    z-index: 999;
    pointer-events: none;
    opacity: 0;
    box-shadow: inset 0 0 240px 70px rgba(0,0,0,0.75);
    transition: opacity 0.5s ease;
  }

  #vignette.vignette-on { opacity: 1; }
  #vignette.vignette-off { opacity: 0; }
</style>
</head>
<body>
  <div class="track" id="track">
    <img id="img1" src="bg.png" alt="" draggable="false">
    <img id="img2" src="bg.png" alt="" draggable="false">
  </div>
  <div id="vignette"></div>

  <script>
    const track = document.getElementById('track');
    const vignette = document.getElementById('vignette');
    const img1 = document.getElementById('img1');
    const img2 = document.getElementById('img2');

    // ===== 可调参数 =====
    const SLOWEST_DURATION = 600;   // 滑块=1 时长（秒）
    const FASTEST_DURATION = 10;    // 滑块=100 时长（秒）
    const DEFAULT_SPEED    = 30;
    const DRAG_RESUME_DELAY = 1200;
    // ===================

    let renderWidth = 0;
    let currentSpeed = DEFAULT_SPEED;
    let offset = 0;
    let speedFactor = 0;
    let lastTimestamp = null;
    let animId = null;
    let isDragging = false;
    let dragPointerId = null;
    let dragStartX = 0;
    let dragStartOffset = 0;
    let resumeAt = 0;

    function calcSpeedFactor(speedVal) {
      const duration = SLOWEST_DURATION - (speedVal - 1) * (SLOWEST_DURATION - FASTEST_DURATION) / 99;
      return renderWidth / duration;
    }

    function normalizeOffset(value) {
      if (!renderWidth) return 0;
      const normalized = value % renderWidth;
      return normalized > 0 ? normalized - renderWidth : normalized;
    }

    function render() {
      track.style.transform = `translateX(${offset}px)`;
    }

    function animate(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const deltaSec = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;
      if (!isDragging && timestamp >= resumeAt) {
        offset = normalizeOffset(offset - speedFactor * deltaSec);
      }
      render();
      animId = requestAnimationFrame(animate);
    }

    function setup() {
      renderWidth = img1.getBoundingClientRect().width;
      track.style.width = (2 * renderWidth) + 'px';
      img1.style.width = renderWidth + 'px';
      img2.style.width = renderWidth + 'px';

      speedFactor = calcSpeedFactor(currentSpeed);
      lastTimestamp = null;
      if (animId) cancelAnimationFrame(animId);
      animId = requestAnimationFrame(animate);
    }

    function startDrag(event) {
      if (!event.isPrimary
        || (event.pointerType === 'mouse' && event.button !== 0)
        || !renderWidth) {
        return;
      }

      event.preventDefault();
      isDragging = true;
      dragPointerId = event.pointerId;
      dragStartX = event.clientX;
      dragStartOffset = offset;
      track.classList.add('is-dragging');
      track.setPointerCapture(event.pointerId);
    }

    function moveDrag(event) {
      if (!isDragging || event.pointerId !== dragPointerId) return;
      event.preventDefault();
      offset = normalizeOffset(dragStartOffset + event.clientX - dragStartX);
      render();
    }

    function finishDrag(event) {
      if (!isDragging || event.pointerId !== dragPointerId) return;

      isDragging = false;
      dragPointerId = null;
      resumeAt = performance.now() + DRAG_RESUME_DELAY;
      lastTimestamp = null;
      track.classList.remove('is-dragging');

      if (track.hasPointerCapture(event.pointerId)) {
        track.releasePointerCapture(event.pointerId);
      }
    }

    window.wallpaperPropertyListener = {
      applyUserProperties: function(properties) {
        if (properties.scrollspeed) {
          currentSpeed = properties.scrollspeed.value;
          speedFactor = calcSpeedFactor(currentSpeed);
        }
        if (properties.vignette) {
          const on = properties.vignette.value === true;
          vignette.className = on ? 'vignette-on' : 'vignette-off';
        }
      }
    };

    track.addEventListener('pointerdown', startDrag);
    track.addEventListener('pointermove', moveDrag);
    track.addEventListener('pointerup', finishDrag);
    track.addEventListener('pointercancel', finishDrag);
    track.addEventListener('lostpointercapture', finishDrag);

    if (document.readyState === 'complete') {
      setup();
    } else {
      window.addEventListener('load', setup);
    }
  </script>
</body>
</html>
